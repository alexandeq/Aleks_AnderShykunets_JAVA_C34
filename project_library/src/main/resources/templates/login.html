<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Вход</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #d4f5d0; /* насыщенный пастельный зеленый */
        margin: 0;
    }

    .login-container {
        background: #ffffff;
        padding: 30px 35px;
        border-radius: 12px;
        width: 340px;
        text-align: center;
        box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    h2 { margin-bottom: 20px; color: #2e7d32; }

    input, button {
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
        border-radius: 6px;
        border: 1px solid #b5d6b3;
        font-size: 14px;
    }

    button {
        background: #2e7d32;
        color: white;
        cursor: pointer;
        font-weight: bold;
        letter-spacing: 0.3px;
    }
    button:hover { background: #256628; }

    .error { color: #c62828; margin-bottom: 10px; font-weight: bold; }
    .success { color: #2e7d32; margin-bottom: 10px; font-weight: bold; }

    a { color: #2e7d32; text-decoration: none; }
    a:hover { text-decoration: underline; }

  </style>
</head>
<body>

<div class="login-container">
  <h2>Вход</h2>

  <p th:if="${error}" th:text="${error}" class="error"></p>
  <p th:if="${param.logout}" class="success">Вы успешно вышли</p>

  <form method="post" th:action="@{/login}">
    <input type="text" name="username" placeholder="Имя пользователя" required />
    <input type="password" name="password" placeholder="Пароль" required />
    <button type="submit">Войти</button>
  </form>

  <p>Нет аккаунта? <a th:href="@{/register}">Регистрация</a></p>
</div>

</body>
</html>
