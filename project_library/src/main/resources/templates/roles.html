<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выбор роли</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #d4f5d0; /* пастельный зеленый фон */
        }

        .role-container {
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        h2 {
            margin-bottom: 20px;
            color: #2e7d32;
        }

        button, input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #b5d6b3;
            background-color: #2e7d32;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover, input[type="submit"]:hover {
            background-color: #256628;
        }

        form {
            margin-bottom: 15px;
        }

    </style>
</head>
<body>

<div class="role-container">
    <h2>Выберите роль</h2>

    <form th:action="@{/movie/user}" method="get">
        <button type="submit">Перейти как USER</button>
    </form>

    <form th:action="@{/movie/admin}" method="get">
        <button type="submit">Перейти как ADMIN</button>
    </form>

    <form th:action="@{/logout}" method="get">
        <input type="submit" value="Logout">
    </form>
</div>

</body>
</html>
