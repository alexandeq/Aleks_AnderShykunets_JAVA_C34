<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${movie.title}">Фильм</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.5;
      margin: 20px;
      background-color: #fafafa;
    }
    h2 { color: #333; }
    img { margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
    hr { margin: 20px 0; }
    textarea { width: 100%; height: 80px; resize: vertical; }
    input[type="number"] { width: 60px; }
    ul { list-style: none; padding: 0; }
    li { border-bottom: 1px solid #ccc; padding: 10px 0; }
    .poster { margin-bottom: 20px; }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background-color: #1976d2;
      color: white;
      cursor: pointer;
    }
    button:hover { background-color: #125da1; }
  </style>
</head>
<body>

<h2 th:text="${movie.title}">Название фильма</h2>
<p><strong>Год:</strong> <span th:text="${movie.year}">Год</span></p>
<p><strong>Средняя оценка:</strong> <span th:text="${movie.rating}">0</span></p>
<p><strong>Описание:</strong> <span th:text="${movie.description}">Описание</span></p>

<hr>

<!-- 🎬 Постер -->
<div class="poster">
  <img th:if="${movie.posterUrl != null and movie.posterUrl != ''}"
       th:src="${movie.posterUrl}"
       alt="Poster" width="200"/>

</div>

<hr>

<h3>Комментарии:</h3>
<ul th:if="${comments != null and #lists.size(comments) > 0}">
  <li th:each="comment : ${comments}">
    <p th:text="${comment.comment}">Текст комментария</p>
    <p><strong>Оценка:</strong> <span th:text="${comment.rating}">0</span></p>
  </li>
</ul>

<hr>

<h3>Оставить комментарий:</h3>
<form th:action="@{'/movie/user/' + ${movie.id} + '/comment'}"
      method="post"
      th:object="${newComment}">
  <label>Комментарий:</label><br>
  <textarea th:field="*{comment}" required></textarea><br>

  <label>Оценка (1-10):</label>
  <input type="number" min="1" max="10" th:field="*{rating}" required/><br><br>

  <button type="submit">Отправить</button>
</form>

</body>
</html>
