<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="'Фильм: ' + ${movie.name}">Фильм</title>
</head>
<body>
<h2 th:text="${movie.name}">Название фильма</h2>

<p><b>Год выпуска:</b> <span th:text="${movie.year}"></span></p>
<p><b>Рейтинг:</b> <span th:text="${movie.rating}"></span></p>
<p><b>Описание:</b> <span th:text="${movie.description}"></span></p>

<hr>

<h3>Оставить комментарий и оценку</h3>
<form th:action="@{/movie/user/{id}/comment(id=${movie.id})}" method="post">
  <label for="comment">Комментарий:</label><br>
  <textarea id="comment" name="comment" rows="4" cols="40"></textarea><br><br>

  <label for="rating">Оценка (1-10):</label>
  <input type="number" id="rating" name="rating" min="1" max="10"/><br><br>

  <button type="submit">Отправить</button>
</form>

<hr>

<h3>Комментарии:</h3>
<div th:if="${movie.comments != null}">
  <div th:each="comment : ${movie.comments}">
    <p>
      <b th:text="${comment.username}">Пользователь</b>:
      <span th:text="${comment.text}">Комментарий</span>
      (<i th:text="${comment.rating}"></i>/10)
    </p>
    <hr>
  </div>
</div>
<div th:if="${movie.comments == null}">
  <p>Пока нет комментариев</p>
</div>

</body>
</html>
