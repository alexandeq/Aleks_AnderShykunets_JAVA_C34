<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${movie.title}">Фильм</title>
</head>
<body>
<h2 th:text="${movie.title}"></h2>
<p><strong>Год:</strong> <span th:text="${movie.year}"></span></p>
<p><strong>Средняя оценка:</strong> <span th:text="${movie.rating}"></span></p>
<p><strong>Описание:</strong> <span th:text="${movie.description}"></span></p>

<hr>

<h3>Комментарии:</h3>
<ul>
  <li th:each="comment : ${comments}">
    <p th:text="${comment.comment}"></p>
    <p><strong>Оценка:</strong> <span th:text="${comment.rating}"></span></p>
  </li>
</ul>

<hr>

<h3>Оставить комментарий:</h3>
<form th:action="@{'/movie/user/' + ${movie.id} + '/comment'}" method="post" th:object="${newComment}">
  <label>Комментарий:</label><br>
  <textarea th:field="*{comment}"></textarea><br>
  <label>Оценка:</label>
  <input type="number" min="1" max="10" th:field="*{rating}"/><br>
  <button type="submit">Отправить</button>
</form>

</body>
</html>
