<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Фильмотека</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #d4f5d0; /* пастельный зеленый фон */
      margin: 0;
      padding: 20px;
    }

    h2 {
      color: #2e7d32;
      text-align: center;
      margin-bottom: 20px;
    }

    form {
      margin-bottom: 20px;
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
    }

    form input[type="text"],
    form input[type="number"],
    form input[type="submit"] {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #b5d6b3;
      font-size: 14px;
    }

    form input[type="submit"] {
      background-color: #2e7d32;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.3s;
    }

    form input[type="submit"]:hover {
      background-color: #256628;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #b5d6b3;
    }

    th {
      background-color: #c8e6c9;
      color: #2e7d32;
    }

    img {
      width: 80px;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background-color: #2e7d32;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #256628;
    }

    a {
      text-decoration: none;
    }

  </style>
</head>
<body>

<h2>Список фильмов</h2>

<form action="/movie/user/search" method="post">
  <input type="text" name="title" placeholder="Название фильма">
  <input type="number" name="from" placeholder="Год от">
  <input type="number" name="to" placeholder="Год до">
  <input type="number" name="rating" placeholder="Оценка">
  <input type="submit" value="Поиск">
</form>

<table>
  <tr>
    <th>Постер</th>
    <th>Название</th>
    <th>Год</th>
    <th>Рейтинг</th>
    <th>Детали</th>
  </tr>
  <tr th:each="movie : ${movies}">
    <td>
      <img th:if="${movie.posterUrl != null}"
           th:src="@{'http://localhost:8082/movie/admin/' + ${movie.id} + '/poster'}"
           alt="Poster"/>
      <span th:if="${movie.posterUrl == null}">—</span>
    </td>
    <td th:text="${movie.title}"></td>
    <td th:text="${movie.year}"></td>
    <td th:text="${movie.rating}"></td>
    <td>
      <a th:href="@{'/movie/user/' + ${movie.id}}">
        <button>Выбрать</button>
      </a>
    </td>
  </tr>
</table>

</body>
</html>
