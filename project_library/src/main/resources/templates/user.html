<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Фильмотека</title>
  <style>
    img {
      width: 60px;
      height: 90px;
      object-fit: cover;
      border-radius: 4px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }
  </style>
</head>
<body>
<h2>Список фильмов</h2>

<form action="/movie/user/search" method="post">
  Поиск фильма: <input type="text" name="title"><br>
  Поиск по году от: <input type="number" name="from"><br>
  Поиск по году до: <input type="number" name="to"><br>
  Оценка фильма: <input type="number" name="rating"><br>
  <input type="submit" value="Поиск">
</form>

<table>
  <tr>
    <th>Постер</th>
    <th>Название</th>
    <th>Год</th>
    <th>Рейтинг</th>
    <th>Детали</th>
  </tr>
  <tr th:each="movie : ${movies}">
    <td>
      <img th:if="${movie.posterUrl != null}"
           th:src="@{'http://localhost:8082/movie/admin/' + ${movie.id} + '/poster'}"
           alt="Poster"/>
      <span th:if="${movie.posterUrl == null}">—</span>
    </td>
    <td th:text="${movie.title}"></td>
    <td th:text="${movie.year}"></td>
    <td th:text="${movie.rating}"></td>
    <td>
      <a th:href="@{'/movie/user/' + ${movie.id}}">
        <button>Выбрать</button>
      </a>
    </td>
  </tr>
</table>

</body>
</html>
