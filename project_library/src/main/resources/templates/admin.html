<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель фильмов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>



        body {
          font-family: Arial;
          margin: 40px;
          background: #d4f5d0;
      }

      .top-bar{
          display:flex;
          align-items:center;
          justify-content:space-between;
          margin-bottom:20px;
          gap:20px;
      }

      .top-bar form{
          margin:0;
      }


          table {
              border-collapse: collapse;
              width: 100%;
              background: white;
          }
          th, td {
              padding: 10px;
              border: 1px solid #ccc;
              text-align: center;
              vertical-align: middle;
          }
          th {
              background: #2e7d32;
              color: white;
          }
          img { width: 60px; height: 90px; border-radius: 4px; }
          tr:hover { background-color: #f1f1f1; }

          .btn { padding: 6px 12px; border: none; border-radius: 4px; color: white; cursor: pointer; }
          .btn-create, .btn-edit { background: #2e7d32; }
          .btn-delete { background: #c62828; }
          .btn-poster { background: #f57c00; }
          .block { margin-bottom: 20px; }
    </style>
</head>
<body>


<h2>Панель администратора</h2>
<a th:href="@{/movie}">← Назад к выбору роли</a>


<div class="top-bar">
    <form action="/movie/admin/search" method="post" style="display:flex; gap:10px;">
        <input type="text" name="title" placeholder="Название фильма">
        <input type="submit" value="Поиск">
    </form>

    <form th:action="@{/movie/admin/create}" method="get">
        <button class="btn btn-create">Добавить фильм</button>
    </form>
</div>

<form th:action="@{/movie/admin/page}" method="post">
    Страница: <input type="number" name="page"> <br>
    Размер:<input type="number" name= "size"> <br>
    <input type="submit" value="Поиск">

</form>

<table>
    <thead>
    <tr>
        <th>Постер</th>
        <th>Название</th>
        <th>Год</th>
        <th>Рейтинг</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="movie : ${movies}">
        <td>
            <img th:if="${movie.posterUrl != null}"
                 th:src="@{'http://localhost:8082/movie/admin/' + ${movie.id} + '/poster'}"
                 alt="Постер"/>
            <span th:if="${movie.posterUrl == null}">—</span>
        </td>
        <td th:text="${movie.title}"></td>
        <td th:text="${movie.year}"></td>
        <td th:text="${movie.rating}"></td>
        <td>
            <a th:href="@{/movie/admin/edit/{id}(id=${movie.id})}" class="btn btn-edit">Редактировать</a>
            <button type="button" class="btn btn-delete" data-bs-toggle="modal"
                    th:data-bs-target="'#deleteModal_' + ${movie.id}">Удалить</button>
            <a th:href="@{/movie/admin/{id}/poster(id=${movie.id})}" class="btn btn-poster"
               th:text="${movie.posterUrl != null ? 'Изменить постер' : 'Добавить постер'}"></a>
        </td>
    </tr>
    </tbody>
</table>


<div th:each="movie : ${movies}" class="modal fade" th:id="'deleteModal_' + ${movie.id}" tabindex="-1"
     th:attr="aria-labelledby='deleteModalLabel_' + ${movie.id}" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" th:id="'deleteModalLabel_' + ${movie.id}">Подтверждение удаления</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                Удалить фильм "<span th:text="${movie.title}"></span>"?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <form th:action="@{/movie/admin/delete/{id}(id=${movie.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-delete">Удалить</button>
                </form>
            </div>
        </div>
    </div>
</div>


</body>
</html>
