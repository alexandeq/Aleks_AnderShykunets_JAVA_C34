<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Загрузка постера</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; margin: 50px; }
    form { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
    h2 { color: #333; }
    input[type=file] { margin-top: 10px; }
    button { margin-top: 20px; background: dodgerblue; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
<h2>Добавить постер к фильму</h2>

<form th:action="@{'/movie/admin/' + ${movieId} + '/poster'}"
      method="post"
      enctype="multipart/form-data">
  <label for="poster">Выберите изображение:</label>
  <input type="file" id="poster" name="poster" accept="image/*" required>

  <button type="submit">Загрузить</button>
</form>

<br>
<a th:href="@{/movie/admin}">⬅ Назад к списку фильмов</a>

</body>
</html>
