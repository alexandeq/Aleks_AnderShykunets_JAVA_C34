<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Загрузка постера</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 50px;
        background: #d4f5d0;
        margin: 0;
    }

    .poster-container {
        background: #ffffff;
        padding: 30px 35px;
        border-radius: 12px;
        width: 400px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        text-align: center;
    }

    h1 {
        color: #2e7d32;
        margin-bottom: 20px;
    }

    input[type="file"] {
        margin-bottom: 15px;
        width: 100%;
    }

    button {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: none;
        background-color: #2e7d32;
        color: white;
        font-weight: bold;
        cursor: pointer;
        letter-spacing: 0.3px;
    }

    button:hover { background-color: #256628; }

    .message {
        color: #2e7d32;
        font-weight: bold;
        margin-top: 15px;
    }

    img {
        display: block;
        margin: 20px auto 0 auto;
        max-width: 300px;
        width: 100%;
        height: auto;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    a {
        display: block;
        margin-top: 20px;
        color: #2e7d32;
        text-decoration: none;
    }
    a:hover { text-decoration: underline; }

  </style>
</head>
<body>

<div class="poster-container">
  <h1>Загрузка постера для фильма</h1>

  <form th:action="@{/movie/admin/{id}/poster(id=${movieId})}" method="post" enctype="multipart/form-data">
    <input type="file" name="poster" required/>
    <button type="submit">Загрузить</button>
  </form>

  <p th:if="${message != null}" th:text="${message}" class="message"></p>
  <img th:if="${posterUrl != null}" th:src="@{'http://localhost:8082' + ${posterUrl}}"/>

  <a th:href="@{/movie/admin}">← Назад к списку фильмов</a>
</div>

</body>
</html>
