<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Загрузка постера</title>
</head>
<body>

<h1>Загрузка постера для фильма</h1>

<form th:action="@{'/movie/' + ${movieId} + '/poster'}" method="post" enctype="multipart/form-data">
  <input type="file" name="poster" required/>
  <button type="submit">Загрузить</button>
</form>

</body>
</html>
