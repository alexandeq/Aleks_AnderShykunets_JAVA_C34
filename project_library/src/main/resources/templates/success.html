<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Успех</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #d4f5d0; /* пастельный зеленый фон */
    }

    .success-container {
        background: #ffffff;
        padding: 30px 35px;
        border-radius: 12px;
        width: 320px;
        text-align: center;
        box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    h2 {
        margin-bottom: 20px;
        color: #2e7d32;
    }

    a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 6px;
        background-color: #2e7d32;
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    a:hover {
        background-color: #256628;
    }
  </style>
</head>
<body>

<div class="success-container">
  <h2 th:text="${message}">Регистрация прошла успешно!</h2>
  <a th:href="@{/login}">Перейти к авторизации</a>
</div>

</body>
</html>
