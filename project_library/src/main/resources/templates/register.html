<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #d4f5d0; /* пастельный зеленый фон */
        }

        .register-container {
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 12px;
            width: 360px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        h2 {
            margin-bottom: 20px;
            color: #2e7d32;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #b5d6b3;
            font-size: 14px;
        }

        button {
            background: #2e7d32;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: #256628;
        }

        a {
            text-decoration: none;
            color: #2e7d32;
            font-size: 14px;
        }

        a:hover {
            text-decoration: underline;
        }

        .message {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error { color: #c62828; }
        .success { color: #2e7d32; }

    </style>
</head>
<body>

<div class="register-container">
    <h2>Регистрация</h2>

    <p th:if="${error}" th:text="${error}" class="error"></p>
    <p th:if="${message}" th:text="${message}" class="success"></p>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <input type="text" th:field="*{username}" placeholder="Имя пользователя" required/>
        <input type="password" th:field="*{password}" placeholder="Пароль" required/>
        <select th:field="*{authority}" required>
            <option value="" disabled selected>Выберите роль</option>
            <option value="USER">Пользователь</option>
            <option value="ADMIN">Администратор</option>
        </select>
        <button type="submit">Зарегистрироваться</button>
    </form>

    <p>Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
</div>

</body>
</html>
