<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить фильм</title>
</head>
<body>

<h2>Добавить новый фильм</h2>

<form th:action="@{/movie/admin/create}" th:object="${movie}" method="post">

    <label for="title">Название:</label><br>
    <input type="text" id="title" th:field="*{title}" required/><br><br>

    <label for="year">Год выпуска:</label><br>
    <input type="number" id="year" th:field="*{year}" required/><br><br>

    <label for="rating">Рейтинг:</label><br>
    <input type="number" id="rating" th:field="*{rating}" step="0.1" min="0" max="10"/><br><br>

    <label for="description">Описание фильма:</label><br>
    <textarea id="description" th:field="*{description}" rows="5" cols="40"
              placeholder="Введите описание фильма..."></textarea><br><br>

    <button type="submit">Добавить фильм</button>
</form>

<br>
<a th:href="@{/movie/admin}">Назад к списку фильмов</a>

</body>
</html>
